<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 100" role="img" aria-labelledby="title desc">
  <title id="title">卓蘭妙玄宮・代行僧菩薩</title>
  <desc id="desc">圓形妙字宮印、直排卓蘭與毛筆妙玄宮字組成的專屬標誌</desc>
  <defs>
    <filter id="ink" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .11" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale=".8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g fill="none" stroke="#b58a43" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="45" cy="43" r="36" stroke-width="2.2"/>
    <circle cx="45" cy="43" r="29" stroke-width="1" opacity=".55"/>
    <path d="M20 27c6-1 10-5 12-11 3 5 7 8 13 8M70 27c-6-1-10-5-12-11-3 5-7 8-13 8" stroke-width="1.5"/>
    <path d="M20 59c7 0 12 4 15 11 3-6 6-10 10-12 4 2 7 6 10 12 3-7 8-11 15-11" stroke-width="1.6"/>
    <path d="M13 43h8M69 43h8" stroke-width="1" opacity=".7"/>
    <path d="M111 16v68" stroke-width="1" opacity=".42"/>

    <path d="M213 19c5-8 15-9 21-2 3-6 10-8 16-4 4 2 6 6 6 10 7-1 13 2 15 8h-58c-4-4-4-8 0-12Z" stroke-width="2"/>
    <path d="M224 31c5 5 11 8 18 9 7-1 13-4 18-9" stroke-width="1" opacity=".65"/>
  </g>

  <text x="45" y="55" text-anchor="middle" fill="#b58a43" stroke="#b58a43" stroke-width=".35" paint-order="stroke" font-family="DFKai-SB, BiauKai, KaiTi, STKaiti, serif" font-size="35" font-weight="700" filter="url(#ink)">妙</text>

  <g fill="#8d754e" font-family="DFKai-SB, BiauKai, KaiTi, STKaiti, serif" font-size="15" font-weight="700">
    <text x="92" y="34" text-anchor="middle">卓</text>
    <text x="92" y="56" text-anchor="middle">蘭</text>
  </g>

  <g fill="#b58a43" stroke="#b58a43" stroke-width=".42" paint-order="stroke" font-family="DFKai-SB, BiauKai, KaiTi, STKaiti, serif" font-size="48" font-weight="700" filter="url(#ink)">
    <text x="127" y="65" transform="rotate(-2 127 65)">妙</text>
    <text x="184" y="62" transform="rotate(1 184 62)">玄</text>
    <text x="241" y="66" transform="rotate(-1 241 66)">宮</text>
  </g>

  <path d="M127 74c46 4 106 4 165 0" fill="none" stroke="#b58a43" stroke-width="1" opacity=".36"/>
  <text x="130" y="91" fill="#756754" font-family="DFKai-SB, BiauKai, KaiTi, STKaiti, serif" font-size="12" font-weight="700" letter-spacing="7">代行僧菩薩</text>
</svg>
